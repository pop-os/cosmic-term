[package]
name = "cosmic-term"
version = "1.5.0"
authors = ["Jeremy Soller <jeremy@system76.com>"]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

[dependencies]
alacritty_terminal = "0.25.1"
# CLI arguments
clap_lex = "0.7.7"
hex_color = { version = "3.0.0", features = ["serde"] }
# Internationalization
i18n-embed = {
  version = "0.16.0",
  features = ["desktop-requester", "fluent-system"]
}
i18n-embed-fl = "0.10.1"
icu = { version = "2.2.0", features = ["compiled_data"] }
indexmap = "2.14.0"
log = "0.4.33"
open = "5.4.0"
paste = "1.0.15"
regex = "1.13.1"
ron = "0.11.0"
rust-embed = "8.12.0"
secret-service = {
  version = "5.1.0",
  features = ["rt-tokio-crypto-rust"],
  optional = true
}
secstr = { version = "0.5.1", optional = true }
serde = { version = "1.0.229", features = ["serde_derive"] }
shlex = "1.3.0"
thiserror = { version = "2.0.19", optional = true }
tokio = { version = "1.53.1", features = ["sync"] }
url = "2.5.8"

[dependencies.cosmic-files]
git = "https://github.com/pop-os/cosmic-files.git"
default-features = false

[dependencies.cosmic-text]
git = "https://github.com/hasanmohammad6618/cosmic-text"
features = ["monospace_fallback", "shape-run-cache"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
# TODO: a11y feature crashes file chooser dialog
features = [
  "about",
  "autosize",
  "multi-window",
  "surface-message",
  "tokio",
  "winit",
]

[build-dependencies]
xdgen = "0.1.0"

[target."cfg(unix)".dependencies]
fork = "0.4.0"

[features]
default = ["dbus-config", "password_manager", "wayland", "wgpu"]
dbus-config = ["libcosmic/dbus-config"]
password_manager = ["secret-service", "secstr", "thiserror"]
wayland = ["cosmic-files/wayland", "libcosmic/wayland"]
wgpu = ["cosmic-files/wgpu", "libcosmic/wgpu"]

[profile.release-with-debug]
inherits = "release"
debug = true
